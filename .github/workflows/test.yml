name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MyCMSSolution.slnx

      - name: Build
        run: dotnet build MyCMSSolution.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MyCMSSolution.slnx --configuration Release --no-build --verbosity normal
